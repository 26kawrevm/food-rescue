services:
  - type: web
    name: food-rescue-api
    runtime: docker
    plan: free
    dockerfilePath: ./render/Dockerfile
    healthCheckPath: /api/dashboard
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:file:/tmp/foodrescue-db
      - key: SPRING_DATASOURCE_USERNAME
        value: sa
      - key: SPRING_DATASOURCE_PASSWORD
        value: ""
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: H2_CONSOLE_ENABLED
        value: "false"
